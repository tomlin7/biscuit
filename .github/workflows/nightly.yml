name: "Biscuit Nightly Builds"
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'nightly')
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install prerequisites
        run: |
          sudo apt update
          sudo apt install -y python3-dev tcl-dev tk-dev fontconfig libfontconfig1-dev cmake cmake-data extra-cmake-modules build-essential

      - name: Install dependencies
        run: uv sync

      - name: Build biscuit
        run: uv run pyinstaller scripts/linux.spec

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "biscuit-nightly-anylinux"
          path: "dist/"

  build-windows:
    runs-on: windows-latest
    if: contains(github.event.head_commit.message, 'nightly')
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Install uv
        run: irm https://astral.sh/uv/install.ps1 | iex

      - name: Install dependencies
        run: uv sync

      - name: Build biscuit
        run: uv run pyinstaller scripts/windows.spec

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "biscuit-nightly-windows"
          path: "dist/"
